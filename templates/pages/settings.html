{% extends "layouts/base.html" %}

{% block title %} 用户设置 {% endblock %}

{% block content %}

<div class="pc-container">
    <div class="pc-content">
        <!-- [ breadcrumb ] start -->
        <div class="page-header">
            <div class="page-block">
                <div class="row align-items-center">
                    <div class="col-md-12">
                        <div class="page-header-title">
                            <h5 class="mb-0">用户设置</h5>
                        </div>
                    </div>
                    <div class="col-md-12">
                        <ul class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="{{ url_for('home_blueprint.index') }}">主页</a></li>
                            <li class="breadcrumb-item"><a href="javascript: void(0)">用户</a></li>
                            <li class="breadcrumb-item" aria-current="page">用户设置</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <!-- [ breadcrumb ] end -->

        <div class="row">
            <div class="col-sm-12">
                <div class="card">
                    <div class="card-header">
                        <h5>DeepSeek API 设置</h5>
                    </div>
                    <div class="card-block px-4 pt-3">
                        <form method="POST">
                            {{ form.hidden_tag() }}

                            <!-- DeepSeek API密钥设置 -->
                            <div class="form-group mb-3">
                                <label class="form-label">{{ form.deepseek_api_key.label }}</label>
                                {{ form.deepseek_api_key(class_="form-control", placeholder="输入你的 DeepSeek API 密钥") }}
                                <small class="text-muted">用于访问 DeepSeek API 服务的密钥</small>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn btn-primary">保存设置</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
